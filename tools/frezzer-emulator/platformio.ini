; Frezzer PRO BLE Emulator
; Runs on any generic ESP32 devkit.
; Change board to lilygo-t-displays3 if you have the LilyGo (see paku_core/boards/).

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; NimBLE-Arduino is much leaner than the default ESP32 BLE library
; and works well as a BLE GATT peripheral (server role).
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.3

monitor_speed = 115200
upload_speed  = 921600

build_flags =
    -DARDUINO_ARCH_ESP32
    -DCORE_DEBUG_LEVEL=0      ; set to 3 for BLE stack debug output
