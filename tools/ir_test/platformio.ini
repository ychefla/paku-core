; IR TX + RX test for ESP32 WROOM32
; Wiring:
;   IR TX  (KY-005 / NPN module): DAT -> GPIO25
;   IR RX  (VS1838B/TSOP38):     OUT -> GPIO27
;
; Usage:
;   pio run -t upload   -- flash
;   pio device monitor  -- open serial at 115200
;
; What it does:
;   - Every 3 s sends a MaxxFan "fan on, 50% speed, exhaust" IR frame via GPIO25
;   - Simultaneously listens on GPIO27 and prints each raw pulse duration
;   - If the RX pin sees pulses within 50 ms of TX, the loop-back is working

[env:ir-test]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
upload_speed = 460800
monitor_speed = 115200
build_flags =
    -DDISABLE_ALL_LIBRARY_WARNINGS
lib_extra_dirs =
    ../../paku_core/lib/MaxxFanIR
lib_ldf_mode = deep
