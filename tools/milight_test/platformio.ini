[env:milight-test]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
upload_speed = 460800
monitor_speed = 115200
lib_deps = nrf24/RF24@^1.4.0
build_flags =

[env:milight-test-no-spi]
extends = env:milight-test
upload_speed = 115200
build_flags =
    -DSNIFFER_DIAG_NO_SPI=1

[env:milight-test-spi-only]
extends = env:milight-test
upload_speed = 115200
build_flags =
    -DSNIFFER_DIAG_SPI_ONLY=1

[env:milight-test-rf24-begin]
extends = env:milight-test
upload_speed = 115200
build_flags =
    -DSNIFFER_DIAG_RF24_BEGIN=1

[env:milight-test-radio-details]
extends = env:milight-test
upload_speed = 115200
build_flags =
    -DSNIFFER_DIAG_RADIO_DETAILS=1

[env:milight-test-fixed-4]
extends = env:milight-test
upload_speed = 115200
build_flags =
    -DSNIFFER_FIXED_CHANNEL=4

[env:milight-test-fixed-74]
extends = env:milight-test
upload_speed = 115200
build_flags =
    -DSNIFFER_FIXED_CHANNEL=74

[env:milight-test-irq]
extends = env:milight-test
build_flags =
    -DSNIFFER_USE_IRQ=1

[env:milight-test-irq-74]
extends = env:milight-test-fixed-74
build_flags =
    -DSNIFFER_USE_IRQ=1
    -DSNIFFER_FIXED_CHANNEL=74

[env:milight-test-irq-edge-74]
extends = env:milight-test-fixed-74
build_flags =
    -DSNIFFER_USE_IRQ=1
    -DSNIFFER_IRQ_EDGE=1
    -DSNIFFER_FIXED_CHANNEL=74

[env:milight-tx]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
upload_speed = 460800
monitor_speed = 115200
lib_deps = nrf24/RF24@^1.4.0
build_src_filter = -<*> +<../src_tx/>

[env:milight-tx-replay10]
extends = env:milight-tx
build_flags =
    -DTX_MODE_REPLAY12=0
    -DTX_MODE_REPLAY10=1
    -DTX_MODE_ENCODED12=0

[env:milight-tx-replay12-fixed]
extends = env:milight-tx
build_flags =
    -DTX_SCAN_ALL_CHANNELS=0
    -DTX_FIXED_CHANNEL=4
    -DTX_REPS=30

[env:milight-tx-encoded12]
extends = env:milight-tx
build_flags =
    -DTX_MODE_REPLAY12=0
    -DTX_MODE_REPLAY10=0
    -DTX_MODE_ENCODED12=1
