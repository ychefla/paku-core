name: Build

on:
  push:
    branches: [main, dev]
    paths:
      - 'paku_core/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'paku_core/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Copy secrets template
        run: cp paku_core/include/secrets.h.template paku_core/include/secrets.h

      - name: Build
        run: |
          cd paku_core
          pio run

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: firmware
          path: paku_core/.pio/build/lilygo-t-display-s3/*.bin
          retention-days: 7
