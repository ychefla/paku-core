; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
;default_envs = lilygo-t-display-s3
default_envs = esp32-ch340c-30pin
;default_envs = esp8266-wired-sensors
src_dir = src
boards_dir = boards

; =============================================================================
; Common settings for all environments
; =============================================================================
[env]
framework = arduino
monitor_speed = 115200  ; Match Serial.begin(115200) in main.cpp
lib_deps = 
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.2.0
	arduino-libraries/NTPClient@^3.2.1
	paulstoffregen/OneWire@^2.3.7
	milesburton/DallasTemperature@^3.11.0

; =============================================================================
; LilyGo T-Display S3 (ESP32-S3 with display)
; =============================================================================
; To use: set default_envs = lilygo-t-display-s3
; Also set in device_config.h: #define DEVICE_LILYGO_T_DISPLAY_S3
[env:lilygo-t-display-s3]
platform = espressif32@6.5.0
board = lilygo-t-displays3

debug_tool = esp-builtin

; Use this when burning with USB CDC
upload_protocol = esptool

; When using ESP32-USB-JTAG debugging
; upload_protocol = esp-builtin

build_flags = 
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; -UARDUINO_USB_CDC_ON_BOOT
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DMQTT_MAX_PACKET_SIZE=512
    -DARDUINO_USB_MODE=1
    ; Choose different options according to different driver chips
    ; Early use of CST328
    -DTOUCH_MODULES_CST_MUTUAL
    ; Use CST816 by default
    ; -DTOUCH_MODULES_CST_SELF        

lib_ignore =
    GFX Library for Arduino
    arduino-nofrendo
    Adafruit MPR121
    DabbleESP32
    PCF8575 library
    PCA95x5
    lvgl
	;TFT_eSPI

; =============================================================================
; ESP32 CH340C 30PIN (ESP32, NOT ESP32-S3, headless)
; =============================================================================
; To use: set default_envs = esp32-ch340c-30pin
; Also set in device_config.h: #define DEVICE_ESP32_CH340C_30PIN
[env:esp32-ch340c-30pin]
platform = espressif32@6.5.0
board = esp32dev

; Use min_spiffs partition scheme for OTA support
; This gives ~1.9MB per app partition (enough for current firmware)
; and still allows OTA updates
board_build.partitions = min_spiffs.csv

upload_protocol = esptool
; Lower upload speed for better reliability with CH340 chips
; If flashing still fails, try: hold BOOT button, press RESET, release BOOT
upload_speed = 460800

build_flags = 
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DMQTT_MAX_PACKET_SIZE=512

lib_ignore =
    GFX Library for Arduino
    arduino-nofrendo
    Adafruit MPR121
    DabbleESP32
    PCF8575 library
    PCA95x5
    lvgl
    TFT_eSPI
    TouchLib
    SensorLib

; =============================================================================
; ESP8266 NodeMCU/Generic (ESP8266, headless with wired sensors)
; =============================================================================
; To use: set default_envs = esp8266-wired-sensors
; Also set in device_config.h: #define DEVICE_ESP8266_WIRED_SENSORS
[env:esp8266-wired-sensors]
platform = espressif8266@4.2.1
board = nodemcuv2

upload_protocol = esptool
upload_speed = 460800

build_flags = 
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DMQTT_MAX_PACKET_SIZE=512

lib_ignore =
    GFX Library for Arduino
    arduino-nofrendo
    Adafruit MPR121
    DabbleESP32
    PCF8575 library
    PCA95x5
    lvgl
    TFT_eSPI
    TouchLib
    SensorLib
    ESP32-audioI2S-3.0.6
    OneButton
