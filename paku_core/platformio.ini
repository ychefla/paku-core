    ${env:waveshare-s3-touch-lcd-43.build_flags}
    -DFAN_IR_ENABLED
    -DDRY_RUN_FAN
lib_extra_dirs =
    lib/MaxxFanIR

[env:waveshare-s3-touch-lcd-43-cabin]
extends = env:waveshare-s3-touch-lcd-43
build_flags =
    ${env:waveshare-s3-touch-lcd-43.build_flags}
    -DFAN_IR_ENABLED
    -DMILIGHT_ENABLED
    -DDRY_RUN_FAN
    -DDRY_RUN_LIGHT
lib_deps =
    ${env.lib_deps}
    nrf24/RF24@^1.4.0
lib_extra_dirs =
    lib/MaxxFanIR

[env:waveshare-s3-touch-lcd-43-cabin-emu]
extends = env:waveshare-s3-touch-lcd-43
build_flags =
    ${env:waveshare-s3-touch-lcd-43.build_flags}
    -DHEATER_ENABLED
    -DHEATER_EMULATE
    -DFAN_IR_ENABLED
    -DDRY_RUN_FAN
    -DMILIGHT_ENABLED
    -DDRY_RUN_LIGHT
lib_deps =
    ${env.lib_deps}
    nrf24/RF24@^1.4.0
lib_extra_dirs =
    ../../hydronic-heater/lib
    lib/MaxxFanIR

