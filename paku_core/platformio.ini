; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = lilygo-t-display-s3
src_dir = src
boards_dir = boards

; =============================================================================
; Common settings for all environments
; =============================================================================
[env]
framework = arduino
lib_deps = 
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.2.0
	arduino-libraries/NTPClient@^3.2.1

; =============================================================================
; LilyGo T-Display S3 (ESP32-S3 with display)
; =============================================================================
; To use: set default_envs = lilygo-t-display-s3
; Also set in device_config.h: #define DEVICE_LILYGO_T_DISPLAY_S3
[env:lilygo-t-display-s3]
platform = espressif32@6.5.0
board = lilygo-t-displays3

debug_tool = esp-builtin

; Use this when burning with USB CDC
upload_protocol = esptool

; When using ESP32-USB-JTAG debugging
; upload_protocol = esp-builtin

build_flags = 
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; -UARDUINO_USB_CDC_ON_BOOT
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DARDUINO_USB_MODE=1
    ; Choose different options according to different driver chips
    ; Early use of CST328
    -DTOUCH_MODULES_CST_MUTUAL
    ; Use CST816 by default
    ; -DTOUCH_MODULES_CST_SELF        

lib_ignore =
    GFX Library for Arduino
    arduino-nofrendo
    Adafruit MPR121
    DabbleESP32
    PCF8575 library
    PCA95x5
    lvgl
	;TFT_eSPI

; =============================================================================
; ESP32 CH340C 30PIN (ESP32, NOT ESP32-S3, headless)
; =============================================================================
; To use: set default_envs = esp32-ch340c-30pin
; Also set in device_config.h: #define DEVICE_ESP32_CH340C_30PIN
[env:esp32-ch340c-30pin]
platform = espressif32@6.5.0
board = esp32dev

; Use larger partition scheme (no OTA) to fit the firmware
; This gives ~3MB for the app instead of the default 1.3MB
board_build.partitions = huge_app.csv

upload_protocol = esptool
upload_speed = 921600

build_flags = 
    -DDISABLE_ALL_LIBRARY_WARNINGS

lib_ignore =
    GFX Library for Arduino
    arduino-nofrendo
    Adafruit MPR121
    DabbleESP32
    PCF8575 library
    PCA95x5
    lvgl
    TFT_eSPI
    TouchLib
    SensorLib
