; =============================================================================
;  HEATER ADD-ON ENVIRONMENTS
;  These extend the base environments with the hydronic-heater library
;  (Autoterm Flow 5D UART, safety monitor, coolant/flow sensors).
;  The hydronic-heater repo lives alongside paku-core under the paku/ workspace.
; =============================================================================

; -----------------------------------------------------------------------------
;  LilyGo T-Display S3 + Heater (ESP32-S3 with display, BLE & heater control)
; -----------------------------------------------------------------------------
[env:lilygo-t-display-s3-heater]
extends = env:lilygo-t-display-s3
build_flags = 
    ${env:lilygo-t-display-s3.build_flags}
    -DHEATER_ENABLED
lib_extra_dirs = 
    ../../hydronic-heater/lib

; -----------------------------------------------------------------------------
;  LilyGo T-Display S3 + Heater EMULATOR (no real heater hardware needed)
;  Generates simulated heater data for display, MQTT, and HA testing.
; -----------------------------------------------------------------------------
[env:lilygo-t-display-s3-heater-emu]
extends = env:lilygo-t-display-s3
build_flags = 
    ${env:lilygo-t-display-s3.build_flags}
    -DHEATER_ENABLED
    -DHEATER_EMULATE
lib_extra_dirs = 
    ../../hydronic-heater/lib

; -----------------------------------------------------------------------------
;  ESP32 + Heater (headless — no display, WiFi + MQTT + heater only)
; -----------------------------------------------------------------------------
[env:esp32-heater]
extends = env:esp32-ch340c-30pin
board_build.partitions = min_spiffs.csv
build_flags = 
    ${env:esp32-ch340c-30pin.build_flags}
    -DHEATER_ENABLED
lib_extra_dirs = 
    ../../hydronic-heater/lib
lib_ignore = 
    TFT_eSPI
    WaveshareHAL
    PakuGUI

; =============================================================================
;  FAN IR CONTROL ENVIRONMENTS
;  These extend the base environments with the MaxxFan IR control library
; =============================================================================

; -----------------------------------------------------------------------------
;  LilyGo T-Display S3 + Fan IR (ESP32-S3 with display, BLE & fan control)
; -----------------------------------------------------------------------------
[env:lilygo-t-display-s3-fan]
extends = env:lilygo-t-display-s3
build_flags = 
    ${env:lilygo-t-display-s3.build_flags}
    -DFAN_IR_ENABLED
    -DDRY_RUN_FAN
lib_extra_dirs = 
    lib/MaxxFanIR

; =============================================================================
;  CABIN COMBINED ENVIRONMENT
;  MaxxFan IR + MiLight light control on a single T-Display S3
; =============================================================================

; -----------------------------------------------------------------------------
;  LilyGo T-Display S3 + Fan IR + MiLight Lights (full cabin control)
;  DRY_RUN flags enabled by default — remove once hardware is connected
; -----------------------------------------------------------------------------
[env:lilygo-t-display-s3-cabin]
extends = env:lilygo-t-display-s3
build_flags = 
    ${env:lilygo-t-display-s3.build_flags}
    -DFAN_IR_ENABLED
    -DMILIGHT_ENABLED
    -DDRY_RUN_FAN
    -DDRY_RUN_LIGHT
lib_deps = 
    ${env.lib_deps}
    nrf24/RF24@^1.4.0
lib_extra_dirs = 
    lib/MaxxFanIR

; -----------------------------------------------------------------------------
;  LilyGo T-Display S3 — FULL EMULATOR (all features, no real HW needed)
;  Heater emulated, fan IR dry-run, MiLight dry-run. OTA-safe.
;  All display pages, MQTT topics, and HA entities exercisable over the air.
; -----------------------------------------------------------------------------
[env:lilygo-t-display-s3-cabin-emu]
extends = env:lilygo-t-display-s3
build_flags = 
    ${env:lilygo-t-display-s3.build_flags}
    -DHEATER_ENABLED
    -DHEATER_EMULATE
    -DFAN_IR_ENABLED
    -DDRY_RUN_FAN
    -DMILIGHT_ENABLED
    -DDRY_RUN_LIGHT
lib_deps = 
    ${env.lib_deps}
    nrf24/RF24@^1.4.0
lib_extra_dirs = 
    ../../hydronic-heater/lib
    lib/MaxxFanIR
