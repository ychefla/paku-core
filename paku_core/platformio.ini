
; -----------------------------------------------------------------------------
;  PlatformIO Project Configuration File for paku-core (EDGE firmware)
; -----------------------------------------------------------------------------
;  Build options: build flags, source filter
;  Upload options: custom upload port, speed and extra flags
;  Library options: dependencies, extra library storages
;  Advanced options: extra scripting
;
;  See: https://docs.platformio.org/page/projectconf.html
;
;  --- DEVICE SELECTION ---
;  Uncomment ONE of the following lines to set your target hardware:
;  (This controls which environment is built and uploaded by default)
;

;  Only ONE default_envs line should be uncommented at a time!
;default_envs = lilygo-t-display-s3         ; ESP32-S3 with display (LilyGo T-Display S3)
;default_envs = waveshare-s3-touch-lcd-43  ; ESP32-S3 Waveshare 4.3" 800×480 RGB LCD
;default_envs = waveshare-s3-touch-lcd-5   ; ESP32-S3 Waveshare 5" 800×480 RGB LCD
;default_envs = esp32-ch340c-30pin         ; ESP32 headless (CH340C 30PIN)
;default_envs = esp8266-wired-sensors      ; ESP8266 NodeMCU/Generic (wired sensors)
;default_envs = lilygo-t-display-s3-heater ; LilyGo + hydronic heater
;default_envs = esp32-heater               ; ESP32 headless + hydronic heater
;
;  Or set via command line: pio run -e <env>
;
[platformio]
default_envs = lilygo-t-display-s3           ; Set your default device here
;default_envs = esp32-ch340c-30pin         ; ESP32 headless (CH340C 30PIN)
;default_envs = esp8266-wired-sensors      ; ESP8266 NodeMCU/Generic (wired sensors)
src_dir = src
boards_dir = boards
extra_scripts = pre:../scripts/pre_build_version.py  ; Auto-inject version from git tags


; -----------------------------------------------------------------------------
;  Common settings for all environments
; -----------------------------------------------------------------------------
[env]
framework = arduino
monitor_speed = 115200
lib_deps = 
    knolleary/PubSubClient@^2.8           ; MQTT client
    bblanchon/ArduinoJson@^7.2.0          ; JSON serialization
    arduino-libraries/NTPClient@^3.2.1    ; NTP time sync
    paulstoffregen/OneWire@^2.3.7         ; 1-Wire bus (DS18B20)
    milesburton/DallasTemperature@^3.11.0 ; DS18B20 temperature sensor
    TFT_eSPI                              ; Display driver (bundled)
    # Add BLE library if needed (e.g., h2zero/NimBLE-Arduino@^1.4.0)
    # Add custom libraries if not in lib/ (PakuIotClient, OtaClient, paku_lib)


; -----------------------------------------------------------------------------
;  LilyGo T-Display S3 (ESP32-S3 with display & BLE)
; -----------------------------------------------------------------------------
[env:lilygo-t-display-s3]
platform = espressif32@6.5.0
board = lilygo-t-displays3
upload_protocol = esptool
upload_port   = /dev/cu.usbmodem1101
;monitor_port  = /dev/cu.usbmodem1101
monitor_speed = 115200
upload_speed  = 115200

build_flags = 
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DMQTT_MAX_PACKET_SIZE=512
    -DARDUINO_USB_MODE=1
    -DTOUCH_MODULES_CST_MUTUAL
    -DDEVICE_MODEL=\"lilygo-t-display-s3\"
    -DDEVICE_LILYGO_T_DISPLAY_S3
lib_ignore =
    WaveshareHAL   ; RGB LCD HAL — Waveshare boards only
    PakuGUI        ; LVGL GUI — Waveshare boards only


; -----------------------------------------------------------------------------
;  LilyGo T-Display S3 + MiLight/MIBO Light Controller (NRF24L01+)
; -----------------------------------------------------------------------------
[env:lilygo-t-display-s3-light]
extends = env:lilygo-t-display-s3
build_flags = 
    ${env:lilygo-t-display-s3.build_flags}
    -DMILIGHT_ENABLED
    -DDRY_RUN_LIGHT
lib_deps = 
    ${env.lib_deps}
    nrf24/RF24@^1.4.0


; -----------------------------------------------------------------------------
;  ESP32 CH340C 30PIN (ESP32, NOT ESP32-S3, headless)
; -----------------------------------------------------------------------------
[env:esp32-ch340c-30pin]
platform = espressif32@6.5.0
board = esp32dev
board_build.partitions = min_spiffs.csv
upload_protocol = esptool
upload_speed = 460800
build_flags = 
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DMQTT_MAX_PACKET_SIZE=512
    -DDEVICE_MODEL=\"esp32-ch340c-30pin\"
    -DDEVICE_ESP32_CH340C_30PIN
lib_ignore =
    TFT_eSPI       ; SPI LCD driver — not used on headless ESP32
    WaveshareHAL   ; RGB LCD HAL — Waveshare boards only
    PakuGUI        ; LVGL GUI — Waveshare boards only


; -----------------------------------------------------------------------------
;  ESP8266 NodeMCU/Generic (ESP8266, headless with wired sensors)
; -----------------------------------------------------------------------------
[env:esp8266-wired-sensors]
platform = espressif8266@4.2.1
board = nodemcuv2
upload_protocol = esptool
upload_speed = 460800
build_flags = 
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DMQTT_MAX_PACKET_SIZE=512
    -DDEVICE_MODEL=\"esp8266-wired-sensors\"
    -DDEVICE_ESP8266_WIRED_SENSORS
lib_ignore =
    TFT_eSPI       ; SPI LCD driver — not used on ESP8266
    WaveshareHAL   ; RGB LCD HAL — Waveshare boards only
    PakuGUI        ; LVGL GUI — Waveshare boards only


; =============================================================================
;  WAVESHARE ESP32-S3-TOUCH-LCD ENVIRONMENTS
;  800×480 RGB LCD boards with CH422G IO expander, RS485, CAN/TWAI.
;  GUI via WaveshareHAL (display + touch) + PakuGUI (LVGL UI).
; =============================================================================

; -----------------------------------------------------------------------------
;  Waveshare ESP32-S3-Touch-LCD-4.3 (SKU: 25948)
;  ST7262 RGB LCD, GT911 touch, CH422G, RS485, CAN, UART header, ADC header
; -----------------------------------------------------------------------------
[env:waveshare-s3-touch-lcd-43]
platform = espressif32@6.5.0
board = waveshare-s3-touch-lcd-43
upload_protocol = esptool
upload_speed = 921600
monitor_speed = 115200
build_flags =
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DTOUCH_MODULES_GT911
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DMQTT_MAX_PACKET_SIZE=512
    -DDEVICE_MODEL=\"waveshare-s3-touch-lcd-43\"
    -DDEVICE_WAVESHARE_LCD_4_3
    -Isrc       ; Allow libraries (WaveshareHAL) to find pin_config.h / device_config.h
    -Iinclude   ; Allow libraries to find secrets.h (transitively included by pin_config.h)
lib_ignore =
    TFT_eSPI       ; SPI LCD driver — not compatible with RGB LCD

;  ST7262 RGB LCD, GT911 touch, CH422G, RS485, CAN, PCF85063A RTC
; -----------------------------------------------------------------------------
[env:waveshare-s3-touch-lcd-5]
platform = espressif32@6.5.0
board = waveshare-s3-touch-lcd-5
upload_protocol = esptool
upload_speed = 921600
monitor_speed = 115200
build_flags =
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DTOUCH_MODULES_GT911
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DMQTT_MAX_PACKET_SIZE=512
    -DDEVICE_MODEL=\"waveshare-s3-touch-lcd-5\"
    -DDEVICE_WAVESHARE_LCD_5
    -Isrc       ; Allow libraries (WaveshareHAL) to find pin_config.h / device_config.h
    -Iinclude   ; Allow libraries to find secrets.h (transitively included by pin_config.h)
lib_ignore =
    TFT_eSPI       ; SPI LCD driver — not compatible with RGB LCD

; =============================================================================
;  WAVESHARE ADD-ON ENVIRONMENTS (4.3")
; =============================================================================

[env:waveshare-s3-touch-lcd-43-heater]
extends = env:waveshare-s3-touch-lcd-43
build_flags =
    ${env:waveshare-s3-touch-lcd-43.build_flags}
    -DHEATER_ENABLED
lib_extra_dirs =
    ../../hydronic-heater/lib

[env:waveshare-s3-touch-lcd-43-heater-emu]
