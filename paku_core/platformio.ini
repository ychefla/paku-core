
; -----------------------------------------------------------------------------
;  PlatformIO Project Configuration File for paku-core (EDGE firmware)
; -----------------------------------------------------------------------------
;  Build options: build flags, source filter
;  Upload options: custom upload port, speed and extra flags
;  Library options: dependencies, extra library storages
;  Advanced options: extra scripting
;
;  See: https://docs.platformio.org/page/projectconf.html
;
;  --- DEVICE SELECTION ---
;  Uncomment ONE of the following lines to set your target hardware:
;  (This controls which environment is built and uploaded by default)
;

;  Only ONE default_envs line should be uncommented at a time!
;default_envs = lilygo-t-display-s3         ; ESP32-S3 with display (LilyGo T-Display S3)
;default_envs = esp32-ch340c-30pin         ; ESP32 headless (CH340C 30PIN)
;default_envs = esp8266-wired-sensors      ; ESP8266 NodeMCU/Generic (wired sensors)
;default_envs = lilygo-t-display-s3-heater ; LilyGo + hydronic heater
;default_envs = esp32-heater               ; ESP32 headless + hydronic heater
;
;  Or set via command line: pio run -e <env>
;
[platformio]
default_envs = lilygo-t-display-s3           ; Set your default device here
;default_envs = esp32-ch340c-30pin         ; ESP32 headless (CH340C 30PIN)
;default_envs = esp8266-wired-sensors      ; ESP8266 NodeMCU/Generic (wired sensors)
src_dir = src
boards_dir = boards


; -----------------------------------------------------------------------------
;  Common settings for all environments
; -----------------------------------------------------------------------------
[env]
framework = arduino
monitor_speed = 115200
lib_deps = 
    knolleary/PubSubClient@^2.8           ; MQTT client
    bblanchon/ArduinoJson@^7.2.0          ; JSON serialization
    arduino-libraries/NTPClient@^3.2.1    ; NTP time sync
    paulstoffregen/OneWire@^2.3.7         ; 1-Wire bus (DS18B20)
    milesburton/DallasTemperature@^3.11.0 ; DS18B20 temperature sensor
    TFT_eSPI                              ; Display driver (bundled)
    # Add BLE library if needed (e.g., h2zero/NimBLE-Arduino@^1.4.0)
    # Add custom libraries if not in lib/ (PakuIotClient, OtaClient, paku_lib)


; -----------------------------------------------------------------------------
;  LilyGo T-Display S3 (ESP32-S3 with display & BLE)
; -----------------------------------------------------------------------------
[env:lilygo-t-display-s3]
platform = espressif32@6.5.0
board = lilygo-t-displays3
upload_protocol = esptool
build_flags = 
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DMQTT_MAX_PACKET_SIZE=512
    -DARDUINO_USB_MODE=1
    -DTOUCH_MODULES_CST_MUTUAL
    -DDEVICE_MODEL=\"lilygo-t-display-s3\"
    -DDEVICE_LILYGO_T_DISPLAY_S3


; -----------------------------------------------------------------------------
;  ESP32 CH340C 30PIN (ESP32, NOT ESP32-S3, headless)
; -----------------------------------------------------------------------------
[env:esp32-ch340c-30pin]
platform = espressif32@6.5.0
board = esp32dev
board_build.partitions = min_spiffs.csv
upload_protocol = esptool
upload_speed = 460800
build_flags = 
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DMQTT_MAX_PACKET_SIZE=512
    -DDEVICE_MODEL=\"esp32-ch340c-30pin\"
    -DDEVICE_ESP32_CH340C_30PIN


; -----------------------------------------------------------------------------
;  ESP8266 NodeMCU/Generic (ESP8266, headless with wired sensors)
; -----------------------------------------------------------------------------
[env:esp8266-wired-sensors]
platform = espressif8266@4.2.1
board = nodemcuv2
upload_protocol = esptool
upload_speed = 460800
build_flags = 
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DMQTT_MAX_PACKET_SIZE=512
    -DDEVICE_MODEL=\"esp8266-wired-sensors\"
    -DDEVICE_ESP8266_WIRED_SENSORS


; =============================================================================
;  HEATER ADD-ON ENVIRONMENTS
;  These extend the base environments with the hydronic-heater library
;  (Autoterm Flow 5D UART, safety monitor, coolant/flow sensors).
;  The hydronic-heater repo lives alongside paku-core under the paku/ workspace.
; =============================================================================

; -----------------------------------------------------------------------------
;  LilyGo T-Display S3 + Heater (ESP32-S3 with display, BLE & heater control)
; -----------------------------------------------------------------------------
[env:lilygo-t-display-s3-heater]
extends = env:lilygo-t-display-s3
build_flags = 
    ${env:lilygo-t-display-s3.build_flags}
    -DHEATER_ENABLED
lib_extra_dirs = 
    ../../hydronic-heater/lib

; -----------------------------------------------------------------------------
;  LilyGo T-Display S3 + Heater EMULATOR (no real heater hardware needed)
;  Generates simulated heater data for display, MQTT, and HA testing.
; -----------------------------------------------------------------------------
[env:lilygo-t-display-s3-heater-emu]
extends = env:lilygo-t-display-s3
build_flags = 
    ${env:lilygo-t-display-s3.build_flags}
    -DHEATER_ENABLED
    -DHEATER_EMULATE
lib_extra_dirs = 
    ../../hydronic-heater/lib

; -----------------------------------------------------------------------------
;  ESP32 + Heater (headless — no display, WiFi + MQTT + heater only)
; -----------------------------------------------------------------------------
[env:esp32-heater]
extends = env:esp32-ch340c-30pin
board_build.partitions = min_spiffs.csv
build_flags = 
    ${env:esp32-ch340c-30pin.build_flags}
    -DHEATER_ENABLED
lib_extra_dirs = 
    ../../hydronic-heater/lib
lib_ignore = 
    TFT_eSPI

; =============================================================================
;  FAN IR CONTROL ENVIRONMENTS
;  These extend the base environments with the MaxxFan IR control library
; =============================================================================

; -----------------------------------------------------------------------------
;  LilyGo T-Display S3 + Fan IR (ESP32-S3 with display, BLE & fan control)
; -----------------------------------------------------------------------------
[env:lilygo-t-display-s3-fan]
extends = env:lilygo-t-display-s3
build_flags = 
    ${env:lilygo-t-display-s3.build_flags}
    -DFAN_IR_ENABLED
    -DDRY_RUN_FAN
lib_extra_dirs = 
    lib/MaxxFanIR
